server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $semevosql_backend http://backend:8065;

    location /api/ {
        proxy_pass $semevosql_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        proxy_pass $semevosql_backend;
        proxy_set_header Host $host;
    }

    # QueryWeaver v1 web-path compatibility. New documentation and generated links use /semevosql/.
    location = /queryweaver {
        return 308 /semevosql/$is_args$args;
    }

    location ~ ^/queryweaver/(.*)$ {
        return 308 /semevosql/$1$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
